lr: 0.00005
weight_decay: 0.0001
lr_warmup_enabled: true
lr_warmup_epochs: 3
lr_warmup_start_factor: 0.1
lr_plateau_enabled: true
lr_plateau_monitor: map0
lr_plateau_mode: max
lr_plateau_factor: 0.5
lr_plateau_patience: 4
lr_plateau_threshold: 0.0001
lr_plateau_threshold_mode: abs
lr_plateau_cooldown: 0
lr_plateau_min_lr: 0.00000001
lr_plateau_eps: 0.00000001
epochs: 300
batch_size: 1



# loss setting
conf_weight: 1.0
loc_weight: 1.0
cls_weight: 1.5
match_iou_threshold: 0.05
loss_focal_gamma: 2.0
loss_focal_alpha: 0.25
loss_neg_pos_ratio: 3.0
loss_iou_weight: 1.0
loss_label_smoothing: 0.05
